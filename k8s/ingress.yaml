apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appsc-amvi-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - amvi-prep.yourdomain.com   # Replace with your production domain name
    secretName: amvi-tls-cert
  rules:
  - host: amvi-prep.yourdomain.com   # Replace with your production domain name
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: appsc-amvi-service
            port:
              number: 80


version: '3.8'

services:
  appsc-amvi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appsc-amvi-prep-portal
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

